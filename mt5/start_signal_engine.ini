; Opens MT5 with XauSignalEngine on an XAUUSD chart. Usage:
;   "C:\Program Files\MetaTrader 5\terminal64.exe" /config:"<path>\mt5\start_signal_engine.ini"
; The Supabase URL must already be in Tools > Options > Expert Advisors > Allow WebRequest
; (WebRequest keys in this file did not work in build 6327 and are left out).
; The engine never trades, so live trading stays disabled. The service key is NOT stored here:
; the engine reads it from MQL5\Files\aurum.env (or from the EA's InpServiceKey input).
[Experts]
AllowLiveTrading=0
AllowDllImport=0
Enabled=1

[StartUp]
Expert=XauSignalEngine
Symbol=XAUUSD
Period=M15
