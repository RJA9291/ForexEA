; Opens MT5 with XauSignalEngine on an XAUUSD chart. Usage:
;   "C:\Program Files\MetaTrader 5\terminal64.exe" /config:"<path>\mt5\start_signal_engine.ini"
; The engine never trades, so live trading stays disabled. The service key is NOT stored here:
; paste it yourself in the EA's Inputs tab (F7 on the chart).
[Experts]
AllowLiveTrading=0
AllowDllImport=0
Enabled=1
WebRequest=1
WebRequestUrl=https://ukzbdszndqvgycsnjeof.supabase.co

[StartUp]
Expert=XauSignalEngine
Symbol=XAUUSD
Period=M15
