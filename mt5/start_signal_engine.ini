; Opens MT5 with XauSignalEngine on an XAUUSD chart. Usage:
;   "C:\Program Files\MetaTrader 5\terminal64.exe" /config:"<path>\mt5\start_signal_engine.ini"
; No [Experts] section on purpose: launches that included one came up with the Allow WebRequest list
; emptied (error 4014), so expert settings are left to Tools > Options > Expert Advisors.
; The engine never trades. The service key is NOT stored here: the engine reads it from
; MQL5\Files\aurum.env (or from the EA's InpServiceKey input).
[StartUp]
Expert=XauSignalEngine
Symbol=XAUUSD
Period=M15
