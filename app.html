<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: single-column phone console; sticky price bar, signal card first, bottom tab bar. */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --panel-2:#f7f5f0; --line:#e3ded2; --fg:#1b1a17; --muted:#6e6a60;
  --gold:#a8771c; --gold-soft:#f3e6c8; --buy:#16834f; --buy-soft:#dcf1e5; --sell:#c4353b; --sell-soft:#f8dfe0;
  --warn:#9a6a00; --warn-soft:#fbecc4;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1113; --panel:#171a1d; --panel-2:#1d2125; --line:#2a2f34; --fg:#ecebe6; --muted:#9a9a93;
  --gold:#e0b25a; --gold-soft:#2c2415; --buy:#3fcf86; --buy-soft:#132a1f; --sell:#f06b70; --sell-soft:#2d1618;
  --warn:#f0c04f; --warn-soft:#2c2412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1113; --panel:#171a1d; --panel-2:#1d2125; --line:#2a2f34; --fg:#ecebe6; --muted:#9a9a93;
  --gold:#e0b25a; --gold-soft:#2c2415; --buy:#3fcf86; --buy-soft:#132a1f; --sell:#f06b70; --sell-soft:#2d1618;
  --warn:#f0c04f; --warn-soft:#2c2412; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.view{display:flex;flex-direction:column;gap:14px}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;font-size:17px}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.px{text-align:right}
.px b{font-family:var(--f-num);font-size:22px;color:var(--gold);font-weight:600}
.px span{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--buy);box-shadow:0 0 0 3px var(--buy-soft)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:24px}
h2{font-size:15px;letter-spacing:.02em}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:.04em;border:1px solid var(--line);background:var(--panel-2)}
.chip.buy{background:var(--buy-soft);color:var(--buy);border-color:transparent}
.chip.sell{background:var(--sell-soft);color:var(--sell);border-color:transparent}
.chip.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.side{font-family:var(--f-display);font-weight:700;font-size:15px;padding:8px 16px;border-radius:10px}
.side.buy{background:var(--buy-soft);color:var(--buy)}
.side.sell{background:var(--sell-soft);color:var(--sell)}
.side.wait{background:var(--panel-2);color:var(--muted)}
.run{display:flex;align-items:baseline;justify-content:space-between;background:var(--panel-2);border-radius:12px;padding:12px 14px}
.run b{font-family:var(--f-num);font-size:26px}
.pos{color:var(--buy)} .neg{color:var(--sell)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv{background:var(--panel-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lv.wide{grid-column:1/-1;align-items:center;text-align:center}
.lv .v{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lv.wide .v{justify-content:center}
.lv b{font-family:var(--f-num);font-size:18px}
.lv.wide b{font-size:28px;color:var(--gold)}
.lv.hit{outline:1.5px solid var(--buy)}
.lv small{color:var(--muted);font-size:12px}
.copy{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;font:inherit;font-size:12px}
.copy:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.reasons{border-left:3px solid var(--gold);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.reasons ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.escape{background:var(--sell-soft);color:var(--sell);border-radius:12px;padding:12px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-num);font-size:17px}
.both{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.both .lv{gap:6px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.muted{color:var(--muted)}
.small{font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{border:0;background:transparent;color:var(--muted);font:600 12px var(--f-body);padding:12px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{color:var(--gold)}
.foot{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:380px){.stats{grid-template-columns:1fr 1fr}.both{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.dot.live{animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.4}}}
</style>

<header class="bar"><div class="bar-in">

</div></nav>

  var STATUS = {

  }

  var CHECK_MS={"Regime":"Regime","News":"Berita","Fundamental":"Fundamental","Devil's Advocate":"Devil's Advocate"};
  function clearanceBlock(c){
    if(!c) return "";
    var k=CLEAR[c.status]||[c.status,"",""];
    var pre=c.stage==="PRE_TRIGGER"?" (sebelum trigger)":"";
    return '<div class="lv" style="gap:8px"><div class="row"><span class="label">Clearance'+pre+'</span>'+

        '<p class="small muted" style="margin:0">Letak kedua-dua order. Bila satu kena, padam yang satu lagi.</p>';
    } else if(s.entry!=null){
      var running = s.result_pips!=null ? s.result_pips : s.running_pips;
      html+='<div class="run"><span class="label">'+(s.result_pips!=null?"Keputusan":"Berjalan")+'</span><b class="num '+cls(running)+'">'+pips(running)+'</b>'+
        (s.peak_pips!=null?'<span class="chip">peak '+pips(s.peak_pips)+'</span>':"")+'</div>';
      var beSet = s.status==="TP1" || s.status==="CLOSED_BE";
      html+='<div class="levels">'+lv("Entry", s.entry, {wide:true})+
        lv(beSet?"Stop loss (BE)":"Stop loss", s.sl)+lv("TP1 · BE", s.tp1, {hit:beSet||s.status==="CLOSED_TP"})+
        lv("TP akhir · 2.5R", s.tp2, {hit:s.status==="CLOSED_TP"})+
        '<div class="lv"><span class="label">Saiz</span><b class="num">'+f2(s.lots)+' lot</b><small>rugi jika SL: $'+f2(s.risk_usd)+'</small></div></div>';
    }
    if(s.escape&&s.escape.advice) html+='<div class="escape"><b>Amaran escape.</b> '+esc(s.escape.advice)+'</div>';
    if(s.escape&&s.escape.note) html+='<p class="small muted" style="margin:0">'+esc(s.escape.note)+'</p>';
    if(s.reasons&&s.reasons.length) html+='<div class="reasons"><span class="label">Sebab signal</span><ul>'+s.reasons.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul></div>';
    html+=critiqueBox(s.critique, s.side);
    html+='</div>';
    html+=statsBlock(s.stats);
    el.innerHTML=nb+html;
  }

  function renderHistory(){
    var list=(data.signals||[]).filter(function(s){return /^CLOSED/.test(s.status);});
    var wins=list.filter(function(s){return s.status==="CLOSED_TP"||(s.result_pips>0&&s.status!=="CLOSED_SL");}).length;
    var total=list.reduce(function(a,s){return a+(Number(s.result_pips)||0);},0);
    var rate=list.length?Math.round(wins/list.length*1000)/10:null;
    var html='<div class="card"><h2>Prestasi signal sebenar</h2><div class="stats">'+
      '<div class="stat"><span class="label">Signal</span><b class="num">'+list.length+'</b></div>'+
      '<div class="stat"><span class="label">Menang</span><b class="num">'+(rate==null?"—":rate+"%")+'</b><small class="muted">backtest 47.5%</small></div>'+
      '<div class="stat"><span class="label">Jumlah</span><b class="num '+cls(total)+'">'+(list.length?pips(total):"—")+'</b></div></div>';
    html+='<div class="list">'+(data.signals||[]).map(function(s){
      var st=STATUS[s.status]||[s.status,""];
      var cl=s.clearance&&CLEAR[s.clearance.status];
      return '<div class="item"><span class="chip '+(s.side==="BUY"?"buy":s.side==="SELL"?"sell":"")+'">'+esc(s.side||"—")+'</span>'+
        '<div><div>'+esc(st[0])+(cl?' <span class="chip '+cl[1]+'">'+esc(cl[0])+'</span>':"")+'</div><div class="small muted">'+esc(when(s.created_at))+'</div></div>'+
        '<b class="num '+cls(s.result_pips)+'">'+(s.result_pips!=null?pips(s.result_pips):"")+'</b></div>';
    }).join("")+'</div></div>';
    document.getElementById("view-history").innerHTML=journalCard()+html;
  }

  function journalCard(){
    var j=data.journal;
    if(!j) return '<div class="card"><h2>Jurnal mingguan</h2><p class="muted small" style="margin:0">Laporan pertama keluar setiap Sabtu selepas minggu dagangan pertama.</p></div>';
    var w=(j.stats&&j.stats.week)||{};
    return '<div class="card"><div class="row"><h2>Jurnal minggu '+esc(j.week_start)+'</h2><span class="chip gold">Ejen Jurnal</span></div>'+
      '<div class="stats"><div class="stat"><span class="label">Ditutup</span><b class="num">'+esc(w.closed||0)+'</b></div>'+
      '<div class="stat"><span class="label">Menang</span><b class="num">'+(w.win_rate==null?"—":w.win_rate+"%")+'</b><small class="muted">backtest '+esc((j.stats&&j.stats.backtest_win_rate)||47.5)+'%</small></div>'+
      '<div class="stat"><span class="label">Pip</span><b class="num '+cls(w.total_pips)+'">'+pips(w.total_pips||0)+'</b></div></div>'+
      '<p style="margin:0">'+esc(j.summary)+'</p>'+
      ((j.lessons&&j.lessons.length)?'<div class="reasons"><span class="label">Pengajaran</span><ul>'+j.lessons.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul></div>':"")+'</div>';
  }

  var BIAS={BULLISH:["Bullish","buy"],BEARISH:["Bearish","sell"],NEUTRAL:["Neutral",""]};
  function fundCard(){
    var f=data.fund;
    if(!f) return '<div class="card"><h2>Fundamental gold</h2><p class="muted small" style="margin:0">Belum ada analisis fundamental untuk hari ini. Ia dikemas kini setiap hari bekerja sebelum 14:00 MYT.</p></div>';
    var b=BIAS[f.bias]||[f.bias,""];
    return '<div class="card"><div class="row"><h2>Fundamental '+esc(f.brief_date)+'</h2><span class="chip '+b[1]+'">'+esc(b[0])+' · keyakinan '+esc(f.confidence)+'</span></div>'+
      '<p style="margin:0">'+esc(f.summary)+'</p>'+
      '<div class="list">'+(f.drivers||[]).map(function(d){var e=BIAS[d.effect]||[d.effect,""];
        return '<div class="item"><span class="chip '+e[1]+'">'+esc(e[0])+'</span><span>'+esc(d.factor)+'</span><span class="small muted">'+esc(d.reading)+'</span></div>';}).join("")+'</div>'+
      '<p class="small muted" style="margin:0">Konteks dari ejen AI, belum diuji dengan backtest. Bukan arahan beli atau jual.</p></div>';
  }

  function renderNews(){
    var n=data.news, el=document.getElementById("view-news");
    if(!n){el.innerHTML=fundCard()+'<div class="card"><h2>Laporan berita</h2><p class="muted">Belum ada laporan untuk hari ini.</p></div>';return;}
    el.innerHTML=fundCard()+'<div class="card"><div class="row"><h2>Laporan '+esc(n.brief_date)+'</h2><span class="chip '+(n.risk_level==="HIGH"?"warn":"")+'">Risiko '+esc(n.risk_level)+'</span></div>'+
      '<p style="margin:0">'+esc(n.summary)+'</p><div class="list">'+(n.events||[]).map(function(e){
        return '<div class="item"><span class="num small">'+esc(e.time)+'</span><span>'+esc(e.title)+'</span><span class="chip '+(e.impact==="HIGH"?"warn":"")+'">'+esc(e.impact)+'</span></div>';
      }).join("")+'</div></div>';
  }

  function renderInfo(){
    document.getElementById("view-info").innerHTML='<div class="card"><h2>London Range Breakout</h2><ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">'+
      '<li>Julat Asia: high dan low 03:00–08:00 waktu server (09:00–14:00 MYT).</li>'+
      '<li>Pada 14:00 MYT: BUY STOP 5 pip di atas high, SELL STOP 5 pip di bawah low. Bila satu kena, padam yang lain.</li>'+
      '<li>SL di hujung julat bertentangan (maksimum 0.6% harga). TP 2.5R. SL ke breakeven pada 1.5R.</li>'+
      '<li>Langkau hari bila julat di bawah 0.30% atau di atas 1.60% harga.</li>'+
      '<li>Backtest menutup trade pada 21:00 server (03:00 MYT).</li></ul>'+
      '<p class="small muted" style="margin:0">Backtest 2024–2026 guna data InstaForex dengan tick dijana dari M1, belum dengan real ticks. Keputusan lalu tidak menjamin keputusan akan datang.</p></div>';
  }

  function renderPrice(){
    var m=data.market, p=document.getElementById("price"), age=document.getElementById("priceAge"), dot=document.getElementById("liveDot");
    if(!m){p.textContent="—";age.textContent="tiada harga";dot.className="dot";return;}
    p.textContent=f2((Number(m.bid)+Number(m.ask))/2);
    var secs=Math.max(0,Math.round((Date.now()-new Date(m.updated_at).getTime())/1000));
    var live=secs<60;
    dot.className="dot"+(live?" live":"");
    age.textContent=live?"Live":(secs<3600?Math.round(secs/60)+" min lalu":"tidak dikemas kini");
  }

  function render(){
    document.getElementById("demoBanner").hidden=!demo;
    renderPrice();renderSignal();renderHistory();renderNews();renderInfo();
  }

  function get(path){
    return fetch(SB_URL+"/rest/v1/"+path,{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});
  }

  function load(){
    if(!SB_URL||!SB_KEY){data=DEMO;demo=true;render();return;}
    Promise.all([
      get("market?symbol=eq.XAUUSD&limit=1"),
      get("signals?order=created_at.desc&limit=40"),
      get("news_briefs?order=brief_date.desc&limit=1"),
      get("journal_reports?order=week_start.desc&limit=1"),
      get("fundamental_briefs?order=brief_date.desc&limit=1")
    ]).then(function(res){
      data={market:res[0][0]||null,signals:res[1],news:res[2][0]||null,journal:res[3][0]||null,fund:res[4][0]||null};demo=false;render();
    }).catch(function(){
      if(!data){data=DEMO;demo=true;}
      render();
    });
  }

  document.addEventListener("click",function(e){
    var b=e.target.closest(".copy");
    if(b){
      var t=b.getAttribute("data-copy");
      var done=function(){b.textContent="Disalin";setTimeout(function(){b.textContent="Salin";},1200);};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){selectText(b);});}else selectText(b);
      return;
    }
    var tab=e.target.closest(".tab");
    if(tab){
      document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",x===tab?"true":"false");});
      document.querySelectorAll(".view").forEach(function(v){v.hidden=v.id!=="view-"+tab.dataset.view;});
      try{localStorage.setItem("aurum.tab",tab.dataset.view);}catch(err){}
    }
  });
  function selectText(b){var n=b.parentNode.querySelector("b");if(!n)return;var r=document.createRange();r.selectNodeContents(n);var s=getSelection();s.removeAllRanges();s.addRange(r);}

  try{var saved=localStorage.getItem("aurum.tab");if(saved){var t=document.querySelector('.tab[data-view="'+saved+'"]');if(t)t.click();}}catch(e){}

  load();
  setInterval(load,POLL_MS);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")load();});
})();
</script>
